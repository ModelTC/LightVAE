[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightvae-training"
version = "0.1.0"
description = "Structure search, LoRA merging and recovery training for LightVAE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8", "torchvision", "einops>=0.7", "safetensors>=0.4.2",
    "numpy", "Pillow", "av", "lpips"
]

[project.optional-dependencies]
h3 = ["diffusers", "accelerate"]
test = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["vae_prune", "vae_prune.*"]
namespaces = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
