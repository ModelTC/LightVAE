[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightvae"
version = "0.1.0"
description = "Compact video VAE encoders and decoders for Wan and MiniMax-H3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "einops>=0.7", "safetensors>=0.4.2"]

[project.optional-dependencies]
cli = ["numpy", "av", "Pillow", "huggingface_hub>=0.34"]

[project.urls]
Repository = "https://github.com/ModelTC/LightVAE"
Models = "https://huggingface.co/lightx2v/LightVAE"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["lightvae", "lightvae.*"]
namespaces = false

[tool.setuptools.package-data]
lightvae = ["config/*.json"]
